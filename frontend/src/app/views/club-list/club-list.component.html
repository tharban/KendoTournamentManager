<ng-container *transloco="let t">
  <div class="table-view">
    <biit-datatable #table id="clubs-table"
                    [columns]="columns"
                    [data]="clubs"
                    [pageSize]="pageSize"
                    [pageSizeList]="pageSizes"
                    [loading]="loading"
                    scrollbarH
                    selectable
    >
      <ng-template #actions>
        <button id="button-plus" biit-icon icon="plus" *ngIf="RbacActivity.CREATE_CLUB | hasPermission"
                [title]="t('clubAdd')"
                (click)="addElement()"
        ></button>
        <button id="button-minus" biit-icon icon="minus" class="warning"
                *ngIf="RbacActivity.DELETE_CLUB | hasPermission"
                [title]="t('delete')"
                (click)="confirmDelete=true"
                [disabled]="!table.selectedRows.length"
        ></button>
        <button id="button-edit" biit-icon icon="edit" *ngIf="RbacActivity.READ_ONE_CLUB | hasPermission"
                [title]="t('clubEdit')"
                (click)="editElement(table.selectedRows[0])"
                [disabled]="!table.selectedRows || table.selectedRows.length != 1"
        ></button>
        <mat-divider class="extra-menu" [vertical]="true"></mat-divider>
        <span class="extra-menu">
        <button id="club-ranking" mat-button *ngIf="(RbacActivity.READ_ALL_COMPETITORS_RANKINGS | hasPermission)"
                [title]="t('competitorsClubRanking')"
                (click)="showRanking=true"
                [disabled]="!table.selectedRows || table.selectedRows.length != 1">
          <mat-icon class="kendo-icon" svgIcon="competitors-classification"></mat-icon>
        </button>
        <button id="club-manager-qr" mat-button *ngIf="(RbacActivity.SEND_CLUB_MANAGER_INVITATION | hasPermission)"
                [title]="t('clubManagerQrHint')"
                (click)="showClubManagerAccessQr(table.selectedRows[0])"
                [disabled]="!table.selectedRows || table.selectedRows.length != 1">
          <mat-icon class="kendo-icon" svgIcon="qr_code"></mat-icon>
        </button>
        <button id="club-manager-email" mat-button *ngIf="(RbacActivity.SEND_CLUB_MANAGER_INVITATION | hasPermission)"
                [title]="t('clubManagerSendEmail')"
                (click)="sendClubManagerInvitation(table.selectedRows[0])"
                [disabled]="!table.selectedRows || table.selectedRows.length != 1">
          <mat-icon>email</mat-icon>
        </button>
        </span>
      </ng-template>
    </biit-datatable>
  </div>

  <club-form-popup *ngIf="target"
                   [club]="target"
                   (onClosed)="this.target = null"
                   (onSaved)="onSaved($event)"
  />


  <biit-popup id="confirmation-delete-popup" *ngIf="confirmDelete"
              no-header
  >
    <div class="vertical">
      <span [innerHTML]="'tournamentDeleteQuestion' | transloco : {name: getClubNames(table.selectedRows)}"></span>
      <div class="flex-grow horizontal buttons-row">
        <button id="confirm-cancel-button" biit-button secondary (click)="confirmDelete = false">{{ t('cancel') }}
        </button>
        <button id="confirm-delete-button" biit-button primary
                (click)="deleteElements(table.selectedRows)">{{ t('delete') }}
        </button>
      </div>
    </div>
  </biit-popup>

  <biit-popup id="ranking-popup" *ngIf="showRanking" [title]="t('competitorsRanking')">
    <competitors-ranking
      [club]="table.selectedRows[0]"
      [showIndex]="true"
      (onClosed)="showRanking=false"></competitors-ranking>
  </biit-popup>

  <biit-popup id="club-manager-qr-popup" *ngIf="showClubManagerQr" [title]="t('clubManagerQrTitle')"
              (onClosed)="showClubManagerQr=false">
    <div class="qr-popup-content">
      <spinner-overlay *ngIf="!clubManagerQrCode"></spinner-overlay>
      <div *ngIf="clubManagerQrCode" class="qr-container">
        <img alt="QR Code" class="qr-code" [src]="clubManagerQrCode"/>
        <a *ngIf="clubManagerQrLink" class="link" target="_blank" [href]="clubManagerQrLink">
          {{ t('orClickHere') }}
        </a>
      </div>
      <div class="button-container">
        <button biit-button id="club-manager-qr-close" (click)="showClubManagerQr=false">
          {{ t('close') }}
        </button>
      </div>
    </div>
  </biit-popup>

</ng-container>
